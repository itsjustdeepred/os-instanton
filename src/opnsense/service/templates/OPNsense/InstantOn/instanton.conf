{#- Generated from the Instant On plugin settings. Do not edit. -#}
{% if helpers.exists('OPNsense.instanton.general') %}
{% set ion = OPNsense.instanton %}
[general]
enabled={{ ion.general.enabled|default('0', true) }}
interval={{ ion.general.interval|default('60', true) }}
history_days={{ ion.general.history_days|default('14', true) }}
flap_threshold={{ ion.general.flap_threshold|default('5', true) }}
poe_warn_percent={{ ion.general.poe_warn_percent|default('80', true) }}

[switch]
enabled={{ ion.switch.enabled|default('0', true) }}
host={{ ion.switch.host|default('', true) }}
username={{ ion.switch.username|default('', true) }}
password={{ ion.switch.password|default('', true) }}
verify_tls={{ ion.switch.verify_tls|default('0', true) }}
uplink_ports={{ ion.switch.uplink_ports|default('', true) }}

[aps]
enabled={{ ion.aps.enabled|default('0', true) }}
discover={{ ion.aps.discover|default('1', true) }}
hosts={{ ion.aps.hosts|default('', true) }}
port={{ ion.aps.port|default('8080', true) }}

[cloud]
enabled={{ ion.cloud.enabled|default('0', true) }}
username={{ ion.cloud.username|default('', true) }}
password={{ ion.cloud.password|default('', true) }}
site={{ ion.cloud.site|default('', true) }}
{% else %}
[general]
enabled=0
{% endif %}
