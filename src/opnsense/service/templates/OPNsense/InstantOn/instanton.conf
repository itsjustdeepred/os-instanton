{#- Generated from the Instant On plugin settings. Do not edit. -#}
{% if helpers.exists('OPNsense.instanton.general') %}
{% set ion = OPNsense.instanton %}
[general]
enabled={{ ion.general.enabled|default('0', true) }}
interval={{ ion.general.interval|default('60', true) }}
history_days={{ ion.general.history_days|default('14', true) }}
flap_threshold={{ ion.general.flap_threshold|default('5', true) }}
poe_warn_percent={{ ion.general.poe_warn_percent|default('80', true) }}
allow_changes={{ ion.general.allow_changes|default('0', true) }}

{% for sw in helpers.toList('OPNsense.instanton.switches.switch') %}
[switch:{{ sw['@uuid'] }}]
enabled={{ sw.enabled|default('0', true) }}
name={{ sw.name|default('', true) }}
host={{ sw.host|default('', true) }}
username={{ sw.username|default('', true) }}
password={{ sw.password|default('', true) }}
verify_tls={{ sw.verify_tls|default('0', true) }}
uplink_ports={{ sw.uplink_ports|default('', true) }}
save_after_change={{ sw.save_after_change|default('1', true) }}

{% endfor %}
[aps]
enabled={{ ion.aps.enabled|default('0', true) }}
discover={{ ion.aps.discover|default('1', true) }}
hosts={{ ion.aps.hosts|default('', true) }}
port={{ ion.aps.port|default('8080', true) }}

{% for acc in helpers.toList('OPNsense.instanton.clouds.account') %}
[cloud:{{ acc['@uuid'] }}]
enabled={{ acc.enabled|default('0', true) }}
name={{ acc.name|default('', true) }}
username={{ acc.username|default('', true) }}
password={{ acc.password|default('', true) }}
sites={{ acc.sites|default('', true) }}

{% endfor %}
{% else %}
[general]
enabled=0
{% endif %}
