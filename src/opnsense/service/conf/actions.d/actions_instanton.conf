[start]
command:/usr/local/etc/rc.d/instanton start
parameters:
type:script
message:starting Instant On monitor

[stop]
command:/usr/local/etc/rc.d/instanton stop
parameters:
type:script
message:stopping Instant On monitor

[restart]
command:/usr/local/etc/rc.d/instanton restart
parameters:
type:script
message:restarting Instant On monitor

[status]
command:/usr/local/etc/rc.d/instanton status; exit 0
parameters:
type:script_output
message:requesting Instant On monitor status

[view]
command:/usr/local/opnsense/scripts/instanton/status.py
parameters:%s
type:script_output
message:requesting Instant On data (%s)

[refresh]
command:/usr/local/opnsense/scripts/instanton/refresh.py
parameters:
type:script_output
message:refreshing Instant On data
description:Refresh Instant On switch and access point data

[test]
command:/usr/local/opnsense/scripts/instanton/test_connection.py
parameters:
type:script_output
message:testing Instant On connections
